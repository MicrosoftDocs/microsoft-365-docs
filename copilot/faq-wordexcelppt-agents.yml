title: "Frequently asked questions about Word, Excel, and PowerPoint Agents: Responsible AI FAQ"
summary: Microsoft 365 is expanding its integration with reasoning models within Copilot, allowing users to create Word, Excel, and PowerPoint files using advanced AI-driven creation agents.

sections:
  - name: General functionality
    questions:
      
      
      - question: "What are Word Agent, Excel Agent, and PowerPoint Agents?"
        
        answer: "
         - These are dedicated Word, Excel, and PowerPoint creation agents powered by reasoning models. They can be accessed via the Microsoft 365 Copilot Chat app. They specialize in generating Office documents based on a conversation with the user. These Agents can create documents based on information from the Web, or they can reference files the user has access to in the user's enterprise graph. The user may also directly provide relevant files by uploading them as part of their conversation with the Agents.
         
         - These Agents can create documents based on information from the Web, or they can reference files the user has access to in the user's enterprise graph. The user may also directly provide relevant files by uploading them as part of their conversation with the Agents."
      
      - question: "What can Word Agent, Excel Agent, and PowerPoint Agents do?"
        
        answer: "Word, Excel, and PowerPoint Agents in Microsoft 365 Copilot let users create Office documents simply by describing what they need in chat. These Agents interpret your intent, plan and build content, and securely incorporate relevant information from both the web and your organization—such as SharePoint files, emails, and Teams chats—helping ensure outputs are accurate, compliant, and tailored to your work context. The result is professional-grade documents generated with enterprise data and real-time web insights, all within the trusted Microsoft 365 environment."
      
      - question: "What are Word Agent, Excel Agent, and PowerPoint Agent's intended use?"
        
        answer: "These Agents were designed to facilitate the initial creation flow for Word documents, Excel workbooks, and PowerPoint presentations. They provide an easy pathway for users to generate Office documents by merely describing what they need and providing relevant context. Then the Agents create an initial draft for you and let you refine the draft with follow-on instructions."
      
      
      - question: "How were Word Agent, Excel Agent, and PowerPoint Agent evaluated? What metrics are used to measure performance?"

        answer: |
          - These Agents were evaluated through extensive automated and manual (human) testing. Evaluation criteria are based on the quality of output created by these agents, benchmarked against the top Word, Excel, and PowerPoint productivity scenarios. 
 
          - Safety evaluations were performed to reduce the potential risks/harms from the Agents generating offensive output or following potentially malicious prompts (user instructions). 
 
          - Performance measurements include response success rates, user satisfaction scores, accuracy ratings based on benchmark tasks and feedback from thumbs-up/thumbs-down interactions.

      - question: "What are the limitations of Word Agent, Excel Agent, and PowerPoint Agent? How can users minimize the impact of Word Agent, Excel Agent, and PowerPoint Agent's limitations when using the system? "
        
        answer: |
          - Word Agent, Excel Agent, and PowerPoint Agent use Large Language Models (LLMs) to generate content. These AI models can make mistakes, misinterpret facts, and/or produce inaccurate results. Users should review all content generated by the Agents. 

          - Word Agent, Excel Agent, and PowerPoint Agent aren't intended for drawing conclusions or making decisions in financial, legal, medical, or other sensitive domains. Document outputs generated by the agent may be incomplete, lack context, or may be inaccurate in other ways. These Agents aren't a replacement for human expertise. Consult qualified professionals when working in regulated or high-stakes environments. 

          - As part of the Frontier program, these agents only support English (United States) as the authoring language. Clients configured for other languages may see inconsistencies in translation of their content. 

          - Word Agent should only support creation of Word documents. Excel Agent should only support creation of Excel spreadsheets. PowerPoint Agent should only support creation of PowerPoint presentations. Testing and evaluations were conducted specifically for these supported scenarios. 

          - The documents generated by Word Agent, Excel Agent, and PowerPoint Agent are opened in side-by-side pane for immediate view, but are **view only** and can't be edited in the side-by-side pane. Users must open the document in the application in order to edit the document. 

          - Documents generated by the Word, Excel, or PowerPoint Agent, open in a side-by-side view for quick access. This view is read-only. You can make high-level edits through chat, but any detailed, slide-, page-, or cell-level changes need to be done by opening the file directly in the application.


      - question: "What operational factors and settings allow for effective and responsible use of Word Agent, Excel Agent, and PowerPoint Agent? "

        answer: "The Word, Excel, and PowerPoint Agents have built-in safety measures to mitigate harmful and inappropriate content. The agents also provide the ability for users to report offensive content back to Microsoft." 

      - question: "How do I provide feedback on Word Agent, Excel Agent, and PowerPoint Agent?"
        
        answer: "
         - Users can provide feedback directly within Word Agent, Excel Agent, and PowerPoint Agent  by using the thumbs-up/thumbs down icons in Copilot chat.

         - System administrators can report issues or share feedback through Microsoft support channels or their account teams.

         - Feedback is reviewed by the product team and used to inform ongoing improvements and prioritization."




